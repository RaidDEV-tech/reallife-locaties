<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Reallife Locaties</title>
<style>:root{--bg:#0a1020;--c:#111a30;--l:#1f2c4d;--t:#e8eefc;--m:#8fa0c8;--a:#3b82f6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif;padding:20px;max-width:980px;margin:auto}
input,select,button{padding:9px 11px;border-radius:8px;border:1px solid var(--l);background:var(--c);color:var(--t);font:inherit}button{cursor:pointer;background:var(--a);border:0;font-weight:600}button.g{background:var(--l)}
.card{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:14px;margin-bottom:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid var(--l);text-align:left;font-size:13px}code{cursor:pointer;color:#93c5fd}[hidden]{display:none!important}</style></head><body>
<h2>🔑 Admin panel</h2>
<div class="card row" id="lg"><input type="password" id="pw" placeholder="Admin-key of wachtwoord"><button id="go">Inloggen</button><span id="m" style="color:#f87171"></span></div>
<div id="ap" hidden>
<div class="card row"><input id="n" type="number" value="1" min="1" max="100" style="width:70px" title="Aantal">
<select id="p"><option value="0">Lifetime</option><option value="1">1 dag</option><option value="7">7 dagen</option><option value="30">30 dagen</option><option value="90">90 dagen</option><option value="365">1 jaar</option><option value="c">Eigen aantal dagen…</option></select>
<input id="nt" placeholder="Notitie (klant)"><button id="mk">Keys genereren</button></div>
<div class="card" id="new" hidden></div>
<div class="card"><table><thead><tr><th>Key</th><th>Plan</th><th>Status</th><th>Discord</th><th>Notitie</th><th></th></tr></thead><tbody id="t"></tbody></table></div></div>
<script>
const $=i=>document.getElementById(i);let T='';
const api=async(p,b)=>(await fetch(p,{method:b?'POST':'GET',headers:{'content-type':'application/json','x-token':T},body:b?JSON.stringify(b):undefined})).json()
$('go').onclick=async()=>{const r=await api('/api/admin/login',{password:$('pw').value});if(r.ok){T=r.token;$('lg').hidden=true;$('ap').hidden=false;load()}else $('m').textContent=r.msg}
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()})
$('mk').onclick=async()=>{let d=$('p').value;if(d==='c')d=+prompt('Aantal dagen?')||0;const r=await api('/api/admin/keys',{count:+$('n').value,days:+d,plan:+d?d+' dagen':'lifetime',note:$('nt').value});$('new').hidden=false;$('new').innerHTML='<b>Nieuwe keys (klik om te kopiëren):</b><br>'+r.map(k=>'<code>'+k.key+'</code>').join('<br>');$('new').querySelectorAll('code').forEach(c=>c.onclick=()=>navigator.clipboard.writeText(c.textContent));load()}
async function load(){const ks=await api('/api/admin/keys');$('t').textContent='';ks.slice().reverse().forEach(k=>{const tr=document.createElement('tr'),st=k.banned?'⛔ geblokkeerd':k.expires?(Date.parse(k.expires)<Date.now()?'verlopen':'tot '+k.expires.slice(0,10)):(k.days?k.days+'d (start bij gebruik)':'lifetime')+(k.hwid?' · 🔒 1 pc':' · vrij')
tr.innerHTML='<td><code>'+k.key+'</code></td><td></td><td></td><td></td><td></td><td></td>';const c=tr.children;c[1].textContent=k.plan;c[2].textContent=st;c[3].textContent=k.discordName||(k.discord?'gekoppeld':'—');c[4].textContent=k.note||''
c[0].firstChild.onclick=()=>navigator.clipboard.writeText(k.key)
;[['reset','Reset pc'],['unlink','Ontkoppel'],['ban',k.banned?'Deblok':'Blok'],['extend','+dagen'],['delete','✕']].forEach(([a,t])=>{const b=document.createElement('button');b.className='g';b.textContent=t;b.style.marginRight='4px';b.onclick=async()=>{let body={};if(a==='extend'){body.days=+prompt('Hoeveel dagen erbij?','30');if(!body.days)return}if(a==='delete'&&!confirm('Verwijderen?'))return;await api('/api/admin/keys/'+k.key+'/'+a,body);load()};c[5].append(b)});$('t').append(tr)})}
</script></body></html>
